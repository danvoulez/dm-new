process_id: workflow-run.v1
status: active
organ: law
activation_ritual:
  slots:
    who: {meaning: "autoridade que solicita o workflow", source: session, predicate: who.authorized}
    did: {meaning: "execução de workflow admitida", source: llm, predicate: did.allowed, values: [run_workflow]}
    this: {meaning: "workflow canônico a executar", source: llm, predicate: this.canonical}
    when: {meaning: "instante de registro do workflow", source: clock, predicate: when.registered_at}
    confirmed_by: {meaning: "autoridade que confirma a orquestração", source: session, predicate: confirmed_by.authority}
    if_ok: {meaning: "continuidade após orquestração", source: contract, predicate: if_ok.compatible, values: [workflow-run.v1]}
    if_doubt: {meaning: "continuidade se a orquestração não for segura", source: contract, predicate: if_doubt.compatible, values: [attention-raise.v1]}
    if_not: {meaning: "continuidade negativa", source: contract, predicate: if_not.compatible, values: [stop]}
    status: {meaning: "estado inicial do workflow", source: contract, predicate: status.initial, values: [registered]}
  required_aux: []
  optional_aux: []
authority_scope: []
adapters: [workflow_run]
danger_tier: L5
evidence_obligation: separate-result-act
doubt_path: attention-raise.v1
