process_id: notification.v1
organ: law
activation_ritual:
  slots:
    who: {meaning: "autoridade que solicita a notificação", source: session, predicate: who.authorized}
    did: {meaning: "ato de notificação admitido", source: llm, predicate: did.allowed, values: [send_notification]}
    this: {meaning: "destinatário ou evento notificado", source: llm, predicate: this.canonical}
    when: {meaning: "instante de registro da notificação", source: clock, predicate: when.registered_at}
    confirmed_by: {meaning: "autoridade que confirma o envio", source: session, predicate: confirmed_by.authority}
    if_ok: {meaning: "continuidade após envio", source: contract, predicate: if_ok.compatible, values: [notification.v1]}
    if_doubt: {meaning: "continuidade se o envio não puder ser provado", source: contract, predicate: if_doubt.compatible, values: [attention-raise.v1]}
    if_not: {meaning: "continuidade negativa", source: contract, predicate: if_not.compatible, values: [stop]}
    status: {meaning: "estado inicial da notificação", source: contract, predicate: status.initial, values: [registered]}
  required_aux: []
  optional_aux: []
authority_scope: []
adapters: []
# §20 — notification is the first IRREVERSIBLE outbound effect (a bell that cannot be
# un-rung). Classified L5: requires a strong grant and a future effect-spec; with no
# registered adapter it cannot execute locally. See docs/OUTBOUND_MEMBRANE_NOTES.md.
danger_tier: L5
evidence_obligation: separate-result-act
doubt_path: attention-raise.v1
