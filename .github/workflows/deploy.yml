name: Deploy (merge on main = everything updated)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: test + build gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: pip install -e ".[webauthn]" pytest
      - run: pytest -q
      - run: lab foundation suite
      - run: lab dream verify
      - run: lab harness
      - run: lab fleet audit --root fleet
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: UI check
        working-directory: ui
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Workers API check
        working-directory: workers/api
        run: |
          npm ci --legacy-peer-deps
          npm run typecheck
          npm test
      - name: Acceptance script syntax
        run: node --check scripts/acceptance/model-routing.mjs

  migrate:
    name: migrate Postgres (ledger)
    needs: gate
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MIGRATE_TOKEN: ${{ secrets.MIGRATE_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Apply migrations via Hyperdrive (ipv6-safe, fallback to psql)
        run: |
          echo "Trying Hyperdrive migrate via Worker (ipv6-safe)..."
          # Worker is already deployed from previous run, try it first (Cloudflare has ipv6)
          if [ -z "$MIGRATE_TOKEN" ]; then echo "MIGRATE_TOKEN is required"; exit 1; fi
          HTTP_CODE=$(curl -s -o /tmp/migrate.json -w "%{http_code}" -X POST https://api.carbonlab.work/api/migrate -H "x-migrate-token: ${MIGRATE_TOKEN}" || echo "000")
          cat /tmp/migrate.json 2>/dev/null | head -c 500; echo " HTTP:$HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ] && grep -q '"ok":true' /tmp/migrate.json; then
            echo "Hyperdrive migrate succeeded"
            exit 0
          fi
          echo "Hyperdrive migrate not yet available, falling back to psql (pooler)..."
          if [ -z "$SUPABASE_DB_URL" ]; then echo "No SUPABASE_DB_URL — skipping"; exit 0; fi
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql "${SUPABASE_DB_URL}" --set ON_ERROR_STOP=on -f migrations/0001_logline_acts.sql
          psql "${SUPABASE_DB_URL}" --set ON_ERROR_STOP=on -f migrations/0002_realtime_publication.sql
          psql "${SUPABASE_DB_URL}" --set ON_ERROR_STOP=on -f migrations/0003_rls_and_search_path.sql
          psql "${SUPABASE_DB_URL}" -c "select relname, relrowsecurity from pg_class where relname='logline_acts';"

  deploy-api:
    name: deploy Workers api
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - working-directory: workers/api
        run: npm ci --legacy-peer-deps
      - name: Deploy to Cloudflare Workers
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

  deploy-ui:
    name: deploy Pages (ui)
    needs: deploy-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - working-directory: ui
        run: |
          npm ci
          VITE_API_URL=https://api.carbonlab.work npm run build
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --prefix ui wrangler pages deploy ui/dist/public --project-name dm-lab-ui
      - name: Deploy UI Worker (app.carbonlab.work)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config workers/ui/wrangler.jsonc
