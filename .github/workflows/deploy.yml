name: Deploy (merge on main = everything updated)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: test + build gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -e ".[webauthn]" pytest
      - run: pytest -q
      - run: lab foundation suite
      - run: lab dream verify
      - run: lab harness
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: UI check
        working-directory: ui
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test
      - name: Workers API check
        working-directory: workers/api
        run: |
          npm ci --legacy-peer-deps
          npx tsc -p tsconfig.json --noEmit

  migrate:
    name: migrate Postgres (ledger)
    needs: gate
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      # alternative: DATABASE_URL
    steps:
      - uses: actions/checkout@v7
      - name: Apply migrations (idempotent)
        if: env.SUPABASE_DB_URL != ''
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          echo "Applying 0001_logline_acts.sql"
          psql "${SUPABASE_DB_URL}" --set ON_ERROR_STOP=on -f migrations/0001_logline_acts.sql
          echo "Applying 0002_realtime_publication.sql"
          psql "${SUPABASE_DB_URL}" --set ON_ERROR_STOP=on -f migrations/0002_realtime_publication.sql
          echo "Applying 0003_rls_and_search_path.sql"
          psql "${SUPABASE_DB_URL}" --set ON_ERROR_STOP=on -f migrations/0003_rls_and_search_path.sql
          psql "${SUPABASE_DB_URL}" -c "select relname, relrowsecurity from pg_class where relname='logline_acts';"
      - name: Skip migrate (no SUPABASE_DB_URL secret)
        if: env.SUPABASE_DB_URL == ''
        run: echo "No SUPABASE_DB_URL secret — skipping migrate (bench-only)."

  deploy-api:
    name: deploy Workers api
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: workers/api
        run: npm ci --legacy-peer-deps
      - name: Deploy to Cloudflare Workers
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

  deploy-ui:
    name: deploy Pages (ui)
    needs: deploy-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: ui
        run: |
          npm ci
          VITE_API_URL=https://api.carbonlab.work npm run build
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --prefix ui wrangler pages deploy ui/dist/public --project-name dm-lab-ui
      - name: Deploy UI Worker (app.carbonlab.work)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config workers/ui/wrangler.jsonc
