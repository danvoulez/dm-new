name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: complete gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            workers/api/package-lock.json
            ui/package-lock.json
      - name: Install Python
        run: pip install -e ".[webauthn]" pytest build
      - name: Python and runtime
        run: |
          pytest -q
          lab foundation suite
          lab dream verify
          lab harness
          lab fleet audit --root fleet
      - name: Workers API
        working-directory: workers/api
        run: |
          npm ci --legacy-peer-deps
          npm run typecheck
          npm test
      - name: UI
        working-directory: ui
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Acceptance script syntax
        run: node --check scripts/acceptance/model-routing.mjs
      - name: Build Python package
        run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
